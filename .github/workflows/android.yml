name: Build Peygir APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle clean assembleDebug
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.${{ github.run_number }}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#Peygir-v1.3.apk" \
            --title "پیگیر نسخه ۱.۳" \
            --notes "نسخه ۱.۳ شامل دکمه شناور قابل جابه‌جایی است. روی دستگاه واقعی آزمایش شود؛ تشخیص پاسخ تماس بر پایه گزارش تماس اندروید محدودیت دارد."
